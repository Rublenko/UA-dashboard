<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Архітектурна схема даних</title>
    <style>
        :root {
            --bg-color: #121212;
            --grid-color: #1e1e1e;
            --card-bg: #1e1e1e;
            --border-color: #444444;
            --border-hover: #38bdf8;
            --accent-color: #38bdf8;
            --text-main: #e0e0e0;
            --text-muted: #888888;
            --key-color: #f59e0b;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 1.5rem;
            min-height: 100vh;
            background-image:
                linear-gradient(to right, var(--grid-color) 1px, transparent 1px),
                linear-gradient(to bottom, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            display: flex;
            flex-direction: column;
            overflow-x: auto;
        }

        /* Індикатор успішного оновлення коду праворуч */
        .sync-badge {
            position: fixed;
            top: 15px;
            right: 20px;
            background-color: #059669;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 0 10px rgba(5, 150, 105, 0.5);
            z-index: 1000;
            animation: pulseBadge 2s infinite;
        }

        @keyframes pulseBadge {
            0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.7); }
            70% { transform: scale(1.05); box-shadow: 0 0 0 8px rgba(5, 150, 105, 0); }
            100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(5, 150, 105, 0); }
        }

        h2 { 
            font-weight: 400; 
            color: var(--text-muted); 
            font-size: 1rem; 
            margin-bottom: 1.5rem; 
            text-align: center;
        }

        .schema-workspace {
            position: relative;
            width: 1100px;
            height: 600px;
            margin: 0 auto;
        }

        .db-card {
            position: absolute;
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 2;
            cursor: pointer;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .db-card:hover, .db-card.active {
            border-color: var(--border-hover);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
        }

        #card-hromadas { left: 40px; top: 220px; }
        #card-prebooking { left: 390px; top: 40px; }
        #card-monitoring { left: 390px; top: 310px; }
        #card-quality { left: 760px; top: 220px; }

        .db-header {
            background-color: #282828;
            padding: 10px 14px;
            font-size: 0.9rem;
            font-weight: 600;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 8px;
            border-radius: 6px 6px 0 0;
        }

        .db-rows { padding: 4px 0; }

        .db-row {
            padding: 7px 14px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            color: var(--text-main);
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }

        .db-row:last-child { border-bottom: none; }
        .db-row.key { color: var(--key-color); }
        .db-row span.field-name { display: flex; align-items: center; gap: 6px; }

        svg.connections-layer {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
